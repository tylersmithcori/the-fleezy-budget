<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="edge" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c6f542"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="gold" x1="24" y1="28" x2="42" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffefb0"/>
      <stop offset=".45" stop-color="#f6b52a"/>
      <stop offset="1" stop-color="#b06f07"/>
    </linearGradient>
    <linearGradient id="flap" x1="9" y1="24" x2="55" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#35e0f7"/>
      <stop offset="1" stop-color="#1aa7d8"/>
    </linearGradient>
    <radialGradient id="tile" cx="32" cy="30" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16233c"/>
      <stop offset="1" stop-color="#05070c"/>
    </radialGradient>
    <clipPath id="bodyClip">
      <rect x="9" y="23" width="46" height="28" rx="8"/>
    </clipPath>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#tile)"/>
  <rect x=".9" y=".9" width="62.2" height="62.2" rx="14.2" fill="none" stroke="url(#edge)" stroke-width="1.8"/>

  <!-- wallet body with electric blue flap -->
  <g clip-path="url(#bodyClip)">
    <rect x="9" y="23" width="46" height="28" fill="#0b1322"/>
    <path d="M9 23h46v6c0 5-10 8-23 8s-23-3-23-8z" fill="url(#flap)"/>
    <path d="M9 29c0 5 10 8 23 8s23-3 23-8" fill="none" stroke="#05070c" stroke-width="1.4"/>
  </g>
  <rect x="9" y="23" width="46" height="28" rx="8" fill="none" stroke="#c6f542" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- gold coin clasp -->
  <g>
    <circle cx="32" cy="37" r="8.6" fill="url(#gold)"/>
    <circle cx="32" cy="37" r="8.6" fill="none" stroke="#05070c" stroke-width="1.5"/>
    <circle cx="32" cy="37" r="4.8" fill="none" stroke="#8a5405" stroke-width="1.5"/>
    <path d="M27.4 33.2a5.6 5.6 0 0 1 4.6-1.7" fill="none" stroke="#fff6d5" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M32 34.2v5.6M29.9 35.6h4.2M29.9 38.4h4.2" fill="none" stroke="#8a5405" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- lime / electric sparks -->
  <path d="M11 12v4.4M8.8 14.2h4.4" stroke="#c6f542" stroke-width="1.9" stroke-linecap="round"/>
  <path d="M53 12v4.4M50.8 14.2h4.4" stroke="#22d3ee" stroke-width="1.9" stroke-linecap="round"/>
</svg>
